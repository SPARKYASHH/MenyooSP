name: Build SPARKYASHH Menyoo
on:
  push:
    branches: [SPARKYASHH-Dances]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Generate Visual Studio solution
        run: .\Solution\external\premake\premake5.exe vs2022
      - uses: microsoft/setup-msbuild@v2
      - name: Build Menyoo
        run: msbuild /m /p:Configuration=Release /p:Platform=x64 Solution/Menyoo.sln
      - name: Assemble test build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/menyooStuff
          Copy-Item Solution/source/_Build/bin/Release/Menyoo.asi package/Menyoo.asi
          Copy-Item menyooStuff/SPARKYASHH_Dances.xml package/menyooStuff/
      - uses: actions/upload-artifact@v4
        with:
          name: SPARKYASHH-Menyoo-test-build
          path: package/
          if-no-files-found: error
